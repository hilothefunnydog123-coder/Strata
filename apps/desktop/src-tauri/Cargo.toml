[package]
name = "assent-desktop"
version = "0.0.0"
description = "Assent Desktop — coverage-policy research terminal"
authors = ["Assent, Inc."]
edition = "2021"
rust-version = "1.77.2"

# The Tauri app is split into a lib (so it can also target mobile) and a thin
# binary that calls into it — the idiomatic Tauri v2 layout.
[lib]
name = "assent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Production adds the SQLite reader used by `search_corpus` (FTS5 querying of the
# @assent/local-db schema), e.g.:
# rusqlite = { version = "0.31", features = ["bundled"] }

[features]
# Enables Tauri's custom-protocol asset serving in release builds.
custom-protocol = ["tauri/custom-protocol"]
