# Render blueprint.
#
# Connect the repository, choose this file, press Apply. There is nothing to
# fill in: every secret is generated by Render, and the two URL variables are
# resolved at startup from RENDER_EXTERNAL_URL, which is the only value the
# platform knows before it has assigned a hostname.
#
# The web service is on standard rather than free, and that is not a preference.
# Measured on this codebase: the production build needs about 700 MB of heap and
# peaks near 1.7 GB of resident memory, while the running server holds about
# 250 MB after serving every public route. Free and starter are both 512 MB, so
# they run this app comfortably and cannot build it. The build dies with
# "JavaScript heap out of memory" and the deploy never starts.
#
# If paying for standard is not wanted, the alternative is to build the image
# somewhere with more memory and have Render run the result, rather than
# building on Render. Nothing in the application needs changing for that.
#
# The database is on free, which is fine to begin with, with one caveat: a free
# Postgres instance is deleted after 30 days. Move it to a paid tier before it
# holds anything you would miss.
#
# Migrations run from the start command rather than a pre-deploy command, so
# that this file still works unchanged if the instance type is lowered later.
# Drizzle records what it has applied in __drizzle_migrations and skips those
# files, so running on every boot is a no-op after the first.
# scripts/migrate.mjs is plain node for this reason: the start command must not
# depend on a development dependency.
#
# After the first deploy, create the first account from the service shell:
#   SUPERADMIN_EMAIL=you@example.com pnpm provision:superadmin

databases:
  - name: strata-db
    databaseName: strata
    user: strata
    plan: free

services:
  - type: web
    name: strata
    runtime: node
    plan: standard
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Node's default heap ceiling is a fraction of visible memory, which on a
      # container reads as the host rather than the limit. Stating it keeps the
      # build inside the instance instead of being killed by the platform.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536

      - key: DATABASE_URL
        fromDatabase:
          name: strata-db
          property: connectionString

      # At least 32 characters. Render generates and stores it.
      - key: BETTER_AUTH_SECRET
        generateValue: true

      # Key material for the clinical columns, not the key itself: lib/env.ts
      # runs it through HKDF-SHA256 to get the 32 bytes AES-256-GCM needs, so a
      # generated value of any shape works. Separate from BETTER_AUTH_SECRET on
      # purpose, and the app refuses to start if the two ever match: rotating or
      # leaking a session secret must not expose clinical records.
      - key: PHI_ENCRYPTION_KEY
        generateValue: true

      # Synthetic is the only supported mode until a BAA exists. In this mode
      # every upload must be tagged synthetic, a banner shows on every
      # authenticated page, and the LLM boundary refuses to transmit anything
      # not marked synthetic. Switching to live additionally requires
      # ANTHROPIC_BAA_CONFIRMED=true and R2 storage.
      - key: PHI_MODE
        value: synthetic

      # Where inbound demo requests are delivered.
      - key: DEMO_REQUEST_TO
        value: hilothefunnydog123@gmail.com

      # Document storage. Render's disk is ephemeral, so this path survives only
      # until the next deploy. Fine for synthetic mode; attach a Render disk or
      # set the four R2_* variables before storing anything worth keeping.
      - key: LOCAL_STORAGE_DIR
        value: /tmp/strata-storage

      # Shared secret the job drain requires. Render generates it. A scheduled
      # request to /api/cron/drain must carry it as `Authorization: Bearer <value>`;
      # without the variable the drain answers 503 rather than running unprotected.
      - key: CRON_SECRET
        generateValue: true

      # Optional, and deliberately absent rather than blank. Without a Resend
      # key, outbound mail is recorded in email_send and reported as unsent
      # rather than silently dropped. Without an Anthropic key, drafting and
      # extraction are unavailable and every other surface works. Add them in
      # the service's Environment tab when you have them.
