name: Sample letters

# Generate appeal letters and print them, so a person can read what the product
# writes.
#
# This answers the one line in SHIPCHECK.md that no test result can: nobody has
# read a letter the model produced. The generation chain has been exercised end
# to end with a stand-in at the model boundary, which proves the wiring and
# proves that a quote missing from its source is rejected. It says nothing about
# whether the writing is any good, and that is what a hospital is being asked to
# put its name on.
#
# It runs here rather than on a laptop for the same reason the corpus stage
# does: this is where the model key and the ingested corpus are. Retrieval needs
# the real corpus, so a letter generated against anything else would be a
# demonstration of the plumbing rather than a sample of the product.
#
# Synthetic cases only, and not as a formality. The letters are printed to a run
# log on a public repository. PHI_MODE is synthetic here, so the model boundary
# refuses any call carrying protected information before it is transmitted, and
# the generator can only select rows tagged synthetic. Both have to hold.

on:
  # Once this file reaches the default branch, it can be started from the
  # Actions tab like the corpus one.
  workflow_dispatch:
    inputs:
      limit:
        description: How many letters to generate
        required: false
        default: '3'
        type: string
      model:
        description: Which model writes the letters
        required: false
        default: openai/gpt-oss-120b
        type: string
      base_url:
        description: >-
          Which provider, if not the configured one. Anthropic's OpenAI
          compatible endpoint is https://api.anthropic.com/v1/ and needs an
          Anthropic key in MODEL_API_KEY.
        required: false
        default: ''
        type: string
      ref:
        description: Which branch's code to run
        required: false
        default: work
        type: string

  # Until then, it runs when the code it depends on changes, which is the only
  # time there is anything new to read. A push event takes the workflow file
  # from the branch pushed, so this works without touching the default branch.
  push:
    branches: [work]
    paths:
      - '.github/workflows/letters.yml'
      - 'scripts/generate-samples.ts'
      # The gate this job runs before it writes anything. Left out when it was
      # added, so a change to the check that decides whether a run is worth
      # starting could not itself start one.
      - 'scripts/check-provider.ts'
      - 'lib/demo/seed.ts'
      - 'lib/appeals/**'
      # The model boundary, which every stage of a letter goes through. Left
      # out at first, so the boundary fix landed and nothing ran.
      - 'lib/llm/**'

# One at a time. Two runs would reseed the demonstration data underneath each
# other, and the second would be generating from rows the first had deleted.
concurrency:
  group: letters
  cancel-in-progress: false

jobs:
  letters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      # Read from a variable or a secret, whichever exists.
      #
      # None of these three is sensitive and all of them belong in Variables.
      # But GitHub puts Secrets and Variables on two tabs of one page under one
      # heading, a value in the wrong tab is invisible to the other, and the
      # symptom is not an error: the expression falls through to the default
      # below and the job runs happily against the wrong provider. That cost two
      # runs and a 401 that read like a bad key.
      #
      # So both are accepted. The cost is that a value supplied as a secret gets
      # masked as *** in the log, including in the configuration block
      # check:provider prints, which makes the next problem harder to see. Put
      # them in Variables if you have the choice.
      MODEL_BASE_URL: ${{ inputs.base_url || vars.MODEL_BASE_URL || secrets.MODEL_BASE_URL || 'https://api.groq.com/openai/v1' }}

      # Off for Anthropic, which ignores response_format rather than honouring
      # it, and on for Groq, which enforces it. Ignored is harmless either way;
      # this is set so the request that goes out is the request that was meant,
      # rather than one carrying a field somebody would later have to check.
      #
      # Nothing depends on it being on. Every stage asks for JSON in the prompt
      # as well, the boundary strips a markdown fence, and a shape that still
      # comes back wrong is corrected and asked again.
      MODEL_JSON_MODE: ${{ vars.MODEL_JSON_MODE || secrets.MODEL_JSON_MODE || 'true' }}

      # Reporting only, and worth setting, because a run that prints what it
      # spent is the only way the cost of a letter stops being a guess. Cents
      # per million tokens. Anthropic publishes dollars per million, so a
      # three dollar input price is 300 here.
      MODEL_PRICE_INPUT_CENTS: ${{ vars.MODEL_PRICE_INPUT_CENTS || '0' }}
      MODEL_PRICE_OUTPUT_CENTS: ${{ vars.MODEL_PRICE_OUTPUT_CENTS || '0' }}
      # Not llama-3.3-70b-versatile, which is the account default and whose
      # free daily allowance is spent: it answered the second drafting attempt
      # with a Retry-After of 600 seconds, which is the daily signal rather than
      # a throttle. Groq meters each model separately, so a model this account
      # has not used today has a full bucket, and this one is larger than the
      # default anyway. Override it from the Actions tab with the model input.
      #
      # The repository variable is what actually sets this today. A
      # workflow_dispatch input only exists once this file is on the default
      # branch, and this one is not, so a run started by pushing gets the
      # variable or the default and never the input.
      #
      # Model ids do not survive a change of provider even when the weights are
      # the same open release. Groq serves this one as openai/gpt-oss-120b and
      # another host serves the identical model as gpt-oss-120b, so setting
      # MODEL_BASE_URL without setting this produces a 404 for a model that is
      # right there. check:provider lists what the provider actually offers.
      # zai-glm-4.7, of the three this account is offered: gemma-4-31b,
      # gpt-oss-120b and zai-glm-4.7. The largest and newest of them, and the
      # choice here is about writing rather than throughput, because this job
      # exists to show a person what the product sounds like.
      #
      # gpt-oss-120b is the same model the Groq attempts ran on, so setting
      # MODEL_NAME to it compares two hosts of one model rather than two models,
      # which is the experiment to run if this one writes badly.
      #
      # Note the missing openai/ prefix. Groq serves this model under
      # openai/gpt-oss-120b and Cerebras under gpt-oss-120b, which is the whole
      # reason check:provider prints the offered ids on a mismatch.
      MODEL_NAME: ${{ inputs.model || vars.MODEL_NAME || secrets.MODEL_NAME || 'zai-glm-4.7' }}

      # Deliberately not set to MODEL_NAME_CORPUS. That variable points at the
      # small model extraction runs on, which is the right economy for reading a
      # manual chapter and the wrong one for writing to a payer. Generation uses
      # MODEL_NAME, and this is the first time anyone will see what that writes.

      # The corpus holds published government documents and the cases here are
      # fabricated, so synthetic is correct and is also the only mode this
      # codebase supports.
      PHI_MODE: synthetic
      BETTER_AUTH_SECRET: letters_runner_no_sessions_are_issued_by_this_job_1
      PHI_ENCRYPTION_KEY: bGV0dGVyc19ydW5uZXJfbmV2ZXJfd3JpdGVzX3BoaV9yb3dz
      BETTER_AUTH_URL: https://medeal.netlify.app
      APP_URL: https://medeal.netlify.app
      DEMO_REQUEST_TO: corpus@example.com
      CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT || 'corpus@medeal.app' }}

      # The seeder writes the two case documents here before parsing reads them
      # back. Ephemeral, which is fine because seeding and generating happen in
      # this one job.
      LOCAL_STORAGE_DIR: .storage-letters

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Say what is being run
        run: |
          echo "Branch:  ${{ inputs.ref || github.ref_name }}"
          echo "Commit:  $(git rev-parse --short HEAD)"
          echo "Subject: $(git log -1 --pretty=%s)"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the secrets are actually set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set."
            exit 1
          fi
          if [ -z "$MODEL_API_KEY" ]; then
            echo "MODEL_API_KEY is not set, and generation is nothing without it."
            exit 1
          fi

      - name: Apply migrations
        run: pnpm db:migrate

      # Before the demonstration data is rewritten and before a single letter is
      # attempted, but after migrations, because this records its own spend like
      # every other call and the table has to exist for that to be anything but
      # a caught error in the log.
      #
      # One small request through the same boundary every stage goes through,
      # costing a fraction of a cent. A key from the wrong provider, a retired
      # model id and a model that refuses a parameter this codebase sends on
      # every request all fail here in seconds, instead of halfway through the
      # first case as an HTTP status.
      - name: Check the provider will take what we send
        run: pnpm check:provider

      # Recreated rather than reused, because the demonstration cases already in
      # the database were written before the seeder parsed the denial letter
      # into passages, and generation refuses a case whose denial letter has
      # none. This deletes and rewrites the demonstration organisation and the
      # four documents the seeder owns. It does not touch the ingested corpus,
      # which lives under different citations.
      - name: Recreate the demonstration cases
        run: pnpm seed:demo --reset

      - name: Write the letters
        run: pnpm tsx scripts/generate-samples.ts --limit=${{ inputs.limit || '3' }} 2>&1 | tee letters.log

      - name: Keep them
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sample-letters
          path: letters.log
          retention-days: 30
          if-no-files-found: ignore
